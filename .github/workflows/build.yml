name: build

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-python-314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.2.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --sync
      - name: Run tests
        run: |
          set +e
          poetry run pytest -vv > pytest-3.14.log 2>&1
          status=$?
          cat pytest-3.14.log
          exit $status
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python-3.14
          path: pytest-3.14.log
