[build-system]
requires = ["poetry-core>=2.2.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ecjtu"
version = "0.2.0"
description = "ECJTU API SDK service"
readme = "README.md"
authors = ["ecjtu <zeeland4work@gmail.com>"]
license = "MIT"
repository = "https://github.com/Undertone0809/ecjtu"
homepage = "https://github.com/Undertone0809/ecjtu"
requires-poetry = ">=2.2.1"
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[tool.poetry.scripts]
"ecjtu" = "ecjtu.__main__:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
httpx = "^0.28.1"
beautifulsoup4 = "^4.15.0"
pydantic = "^2.13.4"
fastapi = "^0.139.0"
uvicorn = "^0.51.0"
cushy-storage = "1.3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.15.21"
pre-commit = "^4.6.0"
coverage = "^7.15.1"
coverage-badge = "^1.1.2"

[tool.ruff]
target-version = "py310"
line-length = 88
respect-gitignore = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--cov=ecjtu",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["ecjtu"]

[tool.coverage.report]
fail_under = 25
show_missing = true
skip_covered = true
